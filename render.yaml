# Render blueprint. Apply it from the dashboard (New → Blueprint) and Render reads
# this file; nothing here needs the CLI.
#
# The database is deliberately NOT declared. Render's own free Postgres expires
# after 30 days, which would take a pilot's real families with it — use Neon's free
# tier instead and paste the connection string into DATABASE_URL. app/db.py accepts
# the postgres:// form Neon prints, so it does not need editing.

services:
  - type: web
    name: mahalladosh
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Generated by Render and never shown to anyone. Sessions are signed with it,
      # so the app refuses to start if it is missing or guessable.
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Paste the Neon connection string here.
      - key: DATABASE_URL
        sync: false
      # The free plan has no disk, so uploads are wiped on every deploy. This flag
      # says "yes, this instance is a throwaway demo and I accept that" and silences
      # the startup warning. NEVER set it true on an instance real families use —
      # instead add a disk and point UPLOAD_DIR at it.
      - key: UPLOADS_MAY_BE_EPHEMERAL
        value: "true"
      # Leave EMPTY unless you want Telegram DMs. An empty token is already "off",
      # which is what keeps a demo from messaging anyone.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Update after the first deploy, once you know the hostname — it is what makes
      # links inside notifications tappable.
      - key: PUBLIC_WEB_URL
        sync: false
